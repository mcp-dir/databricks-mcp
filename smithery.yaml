# Smithery configuration for Databricks
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_databricks

name: databricks-mcp
displayName: "Databricks"
description: >
  Seu Lakehouse Databricks por linguagem natural: rode SQL nos SQL warehouses, acompanhe queries longas, e explore o Unity Catalog (catálogos, schemas, tabelas e colunas), via API REST oficial do workspace. Conecte com a URL do seu workspace e um Personal Access Token (PAT).

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/databricks-mcp
repository: https://github.com/mcp-dir/databricks-mcp

tags:
  - databricks
  - brazil
  - horizontal
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_databricks

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_databricks/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
